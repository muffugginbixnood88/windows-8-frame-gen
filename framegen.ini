[framegen]
; 1 = frame generation allowed, 0 = completely off
Enabled=1

; --- automatic 3D-scene detection -------------------------------------------------------
; Frame generation switches itself on when the game starts drawing real 3D geometry and
; off again on loading screens / 2D menus. It counts the primitives the game submits per frame.
; 1 = detect the 3D scene, 0 = always on as soon as the game's swapchain is found.
SceneDetection=1
; Primitives per frame that count as a 3D scene. A 2D menu is usually a few thousand,
; a 3D world tens of thousands to millions. framegen.log prints the measured value
; ("observing: N primitives/frame") while it is waiting, so you can tune this.
SceneMinPrimitives=30000
; How many consecutive frames above the threshold before it switches on (15 is about half a second).
SceneOnFrames=15
; How many consecutive frames below the threshold before it switches off again.
SceneOffFrames=90

; --- pacing / quality -------------------------------------------------------------------
; Sync interval used for BOTH presents (interpolated + real).
; 1 = vsync paced: output = monitor refresh, base fps = half of it (e.g. 60 Hz -> 30 base / 60 out).
; 2+ = slower pacing. -1 = use whatever the game asks for (with vsync off there is no pacing).
ForceSyncInterval=1
; Resolution divisor for motion estimation: 0 = auto (<=720p: 1, <=1440p: 2, above: 4), or 1 / 2 / 4.
; Higher = cheaper and catches faster motion, but coarser vectors.
MotionScale=0
