[framegen]
; 1 = frame generation on at start, 0 = off
Enabled=1
; Virtual-key code of the toggle hotkey (121 = F10, 0 = disable hotkey)
ToggleKey=121
; Sync interval used for BOTH presents (interpolated + real).
; 1 = vsync paced: output = monitor refresh, base fps = half of it (e.g. 60 Hz -> 30 base / 60 out).
; 2+ = slower pacing. -1 = use whatever the game asks for (with vsync off there is no pacing).
ForceSyncInterval=1
; Resolution divisor for motion estimation: 0 = auto (<=720p: 1, <=1440p: 2, above: 4), or 1 / 2 / 4.
; Higher = cheaper and catches faster motion, but coarser vectors.
MotionScale=0
